name: Generate Snake Graph

on:
  schedule:
    # හැමදාම රෑ 12ට ඔටෝ run වෙන්න
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake graph
        uses: Platane/snk@v3
        with:
          github_user_name: ransara-devnath-ofc
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b26,#16161e,#7aa2f7,#7dcfff,#bb9af7
        env:
          # ඔයා හදපු අලුත් Secret එක මෙතනින් call කරනවා
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
